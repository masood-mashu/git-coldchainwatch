name: mkt-kinetic-temp-calculator
version: 1.0.0
description: "Calculates Mean Kinetic Temperature (MKT) approximation across shipment thermal profile"
input_schema:
  type: object
  properties:
    temp_readings_json:
      type: string
      description: "JSON array of float temperatures in Celsius"
  required:
    - temp_readings_json
implementation:
  type: script
  path: mkt_kinetic_temp_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
