name: transit-sla-auditor
version: 1.0.0
description: "Audits total shipment duration in hours against promised carrier cold chain SLA"
input_schema:
  type: object
  properties:
    hours_in_transit:
      type: string
      description: "Total elapsed transit time in hours"
  required:
    - hours_in_transit
implementation:
  type: script
  path: transit_sla_auditor.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
