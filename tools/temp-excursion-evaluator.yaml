name: temp-excursion-evaluator
version: 1.0.0
description: "Evaluates temperature time-series logs against standard 2C to 8C cold chain bounds"
input_schema:
  type: object
  properties:
    temp_series_json:
      type: string
      description: "JSON array of float temperature readings in Celsius recorded during transit"
  required:
    - temp_series_json
implementation:
  type: script
  path: temp_excursion_evaluator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
